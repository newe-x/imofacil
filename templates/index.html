<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Imofácil - Sua solução imobiliária">
    <meta name="keywords" content="imobiliária, imóveis, compra, venda, aluguel">
    <meta name="author" content="Imofácil">
    <link rel="icon" href="{{ url_for('static', filename='assets/logo.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
    <title>Imofácil</title>
</head>

<body>
    <header class="header">
        <section>
            <a href="#" class="logo">
                <img src="{{ url_for('static', filename='assets/logo.png') }}" alt="Imofácil" class="logo-image">
            </a>
        </section>
    </header>
    <main class="container">
        <form id="LoginForm" action="/login" method="POST">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" name="usuario" placeholder="usuario" required><i class="bi bi-person-fill"></i>
            </div>
            <div class="input-box">
                <input type="password" name="senha" placeholder="senha" required><i class="bi bi-eye-fill toggle-password"></i>
            </div>
            <div class="button">
                <input type="submit" value="Entrar">
            </div>
            <p id="loginResult"></p>
        </form>
    </main>
</body>

</html>
