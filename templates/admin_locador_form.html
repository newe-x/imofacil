{% extends "base.html" %}

{% block content %}
<form action="{{ url_for('admin_novo_locador') }}" method="POST" class="form-card">
    <h1>Novo locador</h1>
    <p class="page-descricao">A senha é temporária: o locador cria uma nova no primeiro acesso.</p>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}

    <div class="input-box">
        <input type="text" name="usuario" placeholder="Usuário" value="{{ usuario if usuario else '' }}" required>
    </div>
    <div class="input-box">
        <input type="password" name="senha" placeholder="Senha" required><i class="bi bi-eye-fill toggle-password"></i>
    </div>

    <div class="button">
        <input type="submit" value="Criar locador">
    </div>
</form>
{% endblock %}
