services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?defina SECRET_KEY no arquivo .env}
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
      - BACKUP_MANTER=${BACKUP_MANTER:-14}
    volumes:
      - ./instance:/app/instance
      - ./contratos/gerados:/app/contratos/gerados
      - ./backups:/app/backups
    restart: unless-stopped
